---
layout: default
---

<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <span class="post-date">{{ page.date | date: "%Y" }} - <a href="https://x.com/calumshepherd">Calum Shepherd</a></span>
  {{ content }}
</div>

<div class="related">
  <span class="eyebrow">Related articles</span>
  <ul class="related-posts">
    {% for post in site.related_posts limit:3 %}
      <li>
        <p>
          <a href="{{ site.url }}{{ post.url }}">
            {{ post.title }}
            <small>{{ post.date | date: "%Y" }}</small>
          </a>
        </p>
      </li>
    {% endfor %}
  </ul>
</div>
